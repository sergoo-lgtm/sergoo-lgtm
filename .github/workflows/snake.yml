name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # بيشتغل كل يوم نص الليل
  workflow_dispatch:      # بيسمحلك تشغله بايدك

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: sergoo-lgtm
          outputs: |
            dist/github-contribution-grid-snake.svg
            # ده السطر اللي بيعمل الصورة الداكنة اللي هنستخدمها
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
