name: Generate Snake

on:
  # تشغيل كل يوم الساعة 12 بالليل بتوقيت جرينتش
  schedule:
    - cron: "0 0 * * *" 
  
  # يسمح لك بتشغيل الأنيميشن يدوياً من قائمة Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          # اسم المستخدم بتاعك
          github_user_name: sergoo-lgtm
          # مكان حفظ الصور الناتجة
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          # التوكن السري عشان يقدر يقرأ نشاطك
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

